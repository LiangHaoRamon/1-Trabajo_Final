version: "3.9"
services:
  db:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wiki
      MYSQL_USER: pipo
      MYSQL_PASSWORD: man
    ports:
      - 3307:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./app/db/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro

  app:
    image: wiki-micro-docker
    container_name: wiki_fastapi_app
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://root:root@db:3306/wiki
    ports:
      - 8000:8000
    volumes:
      - .:/app
    command: >
      sh -c "
      python prestart.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
      
volumes:
  db_data:
