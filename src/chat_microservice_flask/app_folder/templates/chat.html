<!doctype html>
<title>Vincula Cañas</title>
<link rel=stylesheet type=text/css href="{{ url_for('static', filename='style.css') }}">
<div class=page>
  <h1>Vincula Cañas</h1>
  <h3>Conecta con todo Roshar</h3>
  <div class=metanav>
  </div>
  <div>
    <form action="{{ url_for('add_entry') }}" method=post class=add-entry>
      <dl>
        <dt>Petición:
        <dd><textarea name=text rows=5 cols=40></textarea>
        <dd><input type=submit value=Ask>
      </dl>
    </form>
  </div>
  <ul class=entries>
    {% for entry in entries %}
      <li><h2>{{ entry.who }}</h2>{{ entry.text|safe }}
    {% else %}
      <li><em>El chat está vacío.</em>
    {% endfor %}
  </ul>
</div>
